# Lancer : docker compose up --build   →  http://localhost:3000
# Premier lancement : le fichier .env est créé automatiquement (voir ci-dessous) ou copie .env.example.
services:
  manager:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # En local on reste en mode développement (cookie non « Secure », paiement simulé possible).
      # Pour un vrai déploiement : NODE_ENV=production, APP_URL en https, PAY_MODE=fedapay.
      NODE_ENV: ${NODE_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:3000}
      PORT: "3000"
      DB_PATH: /data/manager.db
    volumes:
      - manager-data:/data
    restart: unless-stopped

volumes:
  manager-data:
