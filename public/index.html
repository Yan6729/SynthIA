const BL={genre:x=>'genre : '+x.genre,langue:x=>'langue du public : '+x.lang,réseaux:x=>'réseaux : '+(x.nets.join(', ')||'non précisés'),stats:x=>x.fol?'audience saisie : '+N(x.fol)+' abonnés':'audience non renseignée',type:x=>'projet : '+x.type,stade:x=>'stade : '+x.stade,budget:x=>'budget : '+LV[x.lv].l,date:x=>'sortie : '+x.rel,ville:x=>'marché : '+x.ville,objectif:x=>'objectif : '+x.goal,public:x=>'public : '+x.cible};

const RW=[

[x=>`À ton stade (${x.stade.toLowerCase()}), ${x.big?'ta communauté existante est le premier relais':'tes proches et tes groupes sont ta première communauté'}, sans aucun coût.`,'Obtenir les premiers retours et partages','stade,stats'],
[x=>`La sortie du ${x.rel} est le moment où tout ton public doit savoir où écouter.`,'Concentrer les écoutes le jour J','date,réseaux'],
[x=>`Les groupes locaux de ${x.ville} peuvent relayer ton lien gratuitement.`,'Obtenir des clics vers ton titre','ville,réseaux'],
[x=>`Pour du ${x.genre}, ${x.hook} donne aux fans une façon simple de participer.`,'Faire créer du contenu par tes fans','genre,objectif'],
[x=>`Un sondage demande peu d’efforts à ton public (${x.cible.toLowerCase()}) et te dit ce qu’il préfère.`,'Augmenter les interactions','public,réseaux'],
[x=>`Republier ton meilleur post donne une seconde chance à ceux qui l’ont manqué, sans dépense.`,'Toucher plus de personnes','budget,réseaux'],
[x=>`Un échange de visibilité avec un créateur de ${x.ville} te fait découvrir à son public gratuitement.`,'Toucher un nouveau public','ville,budget'],
[x=>`Remercier ta communauté entretient la relation après la sortie.`,'Fidéliser tes premiers fans','objectif'],
[x=>`Une chaîne WhatsApp te donne un lien direct avec tes fans, sans algorithme.`,'Constituer une communauté fidèle','public,réseaux'],
[x=>`Un bilan montre tes progrès et prépare la suite de ta campagne.`,'Garder l’élan et annoncer la suite','objectif'],
[x=>`Une écoute collective réunit ta communauté de ${x.ville} autour de « ${x.song} », gratuitement.`,'Créer un moment de communauté','ville,public']
];
const dt=(x,w,day)=>{if(!x.d)return '';const m=new Date(x.d);m.setDate(m.getDate()-((m.getDay()+6)%7)+(w-2)*7+DAYS.indexOf(day));return m.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})};
const enrich=(a,x)=>{let {ch,day,what,text}=a,sw='';
if(a.id===3&&x.d)day=DAYS[(x.d.getDay()+6)%7];
if(a.id===2)what=x.stade==='Établi'?'Annoncer le titre à ta communauté via ta chaîne et tes statuts WhatsApp':x.stade==='Débutant'?'Envoyer l’extrait à 20 proches et dans 3 groupes WhatsApp':'Envoyer l’extrait à 50 contacts et dans 5 groupes WhatsApp';
if(a.id===5){what='Lancer '+x.hook+' sur le refrain';text=`Défi #${x.tag}Challenge ! Fais ${x.hook} sur le refrain de « ${x.song} », identifie-moi et je partage les meilleurs !`}
if(!/^(Toutes|WhatsApp)/.test(ch)&&x.nets.length&&!x.nets.includes(ch)){ch=x.nets[0];sw=` Adapté à tes réseaux : ${ch}.`}
if(ch!=='WhatsApp')text+='\n'+x.hs;

const extras=x=>{const o=[],ch=x.nets.find(n=>n!=='WhatsApp')||'WhatsApp',mk=(id,w,day,c,what,measure,why,aim,b,text)=>o.push({id,w,day,ch:c,what,when:'18 h',time:'30 min',cost:0,measure,text,lv:x.lv,date:dt(x,w,day),why,aim,basis:b.map(k=>BL[k](x))});
if(x.type!=='Single')mk(20,3,'Dimanche',ch,`Faire écouter un deuxième titre de ton ${x.type}`,'Écoutes du deuxième titre',`Ton projet est un ${x.type} : montrer plusieurs titres donne des raisons de revenir.`,'Faire découvrir tout ton projet',['type'],`Tu as aimé « ${x.song} » ? Écoute un autre titre de mon ${x.type} 🎧 ${x.hs}`);
if(x.goal==='Remplir un concert')mk(21,4,'Mercredi','Instagram','Annoncer ton prochain concert ou ta prochaine scène','Réponses et réservations',`Ton objectif est de remplir une salle à ${x.ville}.`,'Faire venir ton public en vrai',['objectif','ville'],`On se retrouve à ${x.ville} ! Dis-moi si tu viens 🎤 ${x.hs}`);
if(x.goal==='Gagner des abonnés')mk(22,3,'Mercredi',ch,'Inviter clairement ton public à s’abonner à ton compte','Nouveaux abonnés','Ton objectif est de gagner des abonnés : une invitation claire en fait venir davantage.','Convertir les spectateurs en abonnés',['objectif'],`Abonne-toi pour ne rien rater de mes prochains titres 🔔 ${x.hs}`);
return o};
const buildPlan=(p,st)=>{const x=ctx(p,st);return [...buildPlanBase(p).map(a=>enrich(a,x)),...extras(x)].sort((a,b)=>a.w-b.w||DAYS.indexOf(a.day)-DAYS.indexOf(b.day))};

/* ---------- Plan : moteur de règles local + textes IA (PREMIUM) ----------
   Le moteur local construit toujours le plan. Pour un compte PREMIUM, AI_CFG.endpoint pointe vers /api/ai/plan : le serveur appelle l’IA
   (clé secrète jamais dans le navigateur) et renvoie [{id,text}], fusionnés dans le plan. En cas d’échec : textes du moteur local. */
const AI_CFG={endpoint:null};
const AI={async generatePlan(profil,stats){
const pl=buildPlan(profil,stats);if(!AI_CFG.endpoint)return pl;
try{const r=await fetch(AI_CFG.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profil,actions:pl.map(a=>({id:a.id,ch:a.ch,what:a.what,text:a.text}))})});if(r.ok){const j=await r.json();if(Array.isArray(j)){const m={};j.forEach(t=>{if(t&&typeof t.text==='string'&&t.text.trim())m[t.id]=t.text});return pl.map(a=>m[a.id]?{...a,text:m[a.id],ai:true}:a)}}}catch(e){}return pl}};

/* ---------- Réseaux sociaux ----------
   Tout le flux OAuth est côté serveur : /api/social/:plateforme/connect (state + PKCE), jetons chiffrés, relevés lus par le serveur.
   Le navigateur ne voit que le nom du compte et les chiffres. Une plateforme non configurée affiche « Bientôt disponible ». */
const OAUTH={tiktok:{n:'TikTok'},instagram:{n:'Instagram'},youtube:{n:'YouTube'}};
const MET=[['f','Abonnés'],['v','Vues'],['l','Likes'],['p','Publications']];
const pct=x=>(x>0?'+':'')+String(x).replace('.',',')+' %';
function Net({p,s,set,refresh,off}){
const H=s.hist,c=H[H.length-1],pv=H[H.length-2],evo=k=>pv&&c[k]!=null&&pv[k]>0?Math.round((c[k]-pv[k])/pv[k]*1000)/10:null;
return html`<div class="mt-4 pt-4 border-t" style=${{borderColor:'var(--bd)'}}>
<div class="flex items-center gap-3"><span class="w-11 h-11 rounded-full grid place-items-center text-white font-bold bar" aria-hidden="true">${(s.name||OAUTH[p].n).replace('@','')[0].toUpperCase()}</span><div class="flex-1 min-w-0"><p class="font-semibold truncate">${s.name||OAUTH[p].n}</p><p class="text-xs mut">${OAUTH[p].n} · connecté</p>${s.status==='expired'&&html`<p class="text-xs err">Connexion expirée : déconnecte puis reconnecte ce réseau.</p>`}</div></div>
<div class="grid grid-cols-2 gap-2 mt-3">${MET.map(([k,l])=>html`<div key=${k} class="rounded-xl p-3" style=${{background:'var(--bg)'}}>${c[k]==null?html`<input type="number" min="0" inputMode="numeric" class="inp" aria-label=${l} placeholder="Saisie manuelle" value=${s.man[k]??''} onInput=${e=>set({...s,man:{...s.man,[k]:e.target.value===''?'':+e.target.value}})}/>`:html`<p class="text-xl font-extrabold">${N(c[k])}</p>`}<p class="text-sm mut">${l}</p>${c[k]==null?html`<p class="text-xs mut">Non fournie par ${OAUTH[p].n}</p>`:evo(k)!==null&&html`<p class=${'text-xs '+(evo(k)>=0?'ok':'err')}>${pct(evo(k))} depuis la dernière mise à jour</p>`}</div>`)}</div>
<p class="text-xs mut mt-3 mb-1">Évolution des abonnés (${H.length} relevé${H.length>1?'s':''})</p><${Line} a=${H.map(x=>x.f)} b=${[]} lab=${'Évolution des abonnés '+OAUTH[p].n}/>
<div class="flex flex-wrap items-center gap-2 mt-2"><button class="chip" onClick=${refresh}>Actualiser</button><button class="chip" onClick=${off}>Déconnecter</button><span class="text-xs mut">Dernier relevé : ${new Date(c.t).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}</span></div></div>`}
function Reseaux({soc,setSoc}){
const S=useContext(SrvC),pc=useWide(),keys=Object.keys(OAUTH);
const all={};keys.forEach(k=>{if(S.live[k]&&S.live[k].hist&&S.live[k].hist.length)all[k]={...S.live[k],man:(soc[k]&&soc[k].man)||{}}});
const on=keys.filter(k=>all[k]),avail=keys.filter(k=>!all[k]&&S.feat.social.includes(k)),soon=keys.filter(k=>!all[k]&&!S.feat.social.includes(k));
const click=async p=>{if(!S.user){S.say('Crée un compte pour connecter ton réseau');S.go('reglages');return}
const r=await API.call('GET','/api/social/'+p+'/connect');if(r.ok&&r.json&&r.json.url)location.href=r.json.url;else S.say((r.json&&r.json.message)||'Connexion impossible pour le moment')};
const set=(p,s)=>setSoc({...soc,[p]:{live:true,man:s.man}});
const refresh=async p=>{const r=await API.call('POST','/api/social/'+p+'/sync');if(r.ok)S.setLive(r.json.accounts);else S.say(r.status===429?'Un seul relevé par heure':(r.json&&r.json.error)==='connexion_expiree'?'Connexion expirée : déconnecte puis reconnecte ce réseau':'Relevé impossible pour le moment')};
const off=async p=>{const r=await API.call('DELETE','/api/social/'+p);if(!r.ok){S.say('Déconnexion impossible pour le moment');return}const n={...S.live};delete n[p];S.setLive(n);const m={...soc};delete m[p];setSoc(m)};
const tot=on.reduce((a,k)=>a+(all[k].hist[all[k].hist.length-1].f||0),0);
return html`<section class="card"><h2 class="font-bold">Mes réseaux sociaux</h2><p class="text-sm mut mt-1">Connecte tes comptes : Synthia récupère tes statistiques via l’API officielle, en lecture seule, sans jamais te demander ton mot de passe.</p>
<div class="flex flex-wrap gap-2 mt-3">${avail.map(k=>html`<button key=${k} class="btn" onClick=${()=>click(k)}>Connecter ${OAUTH[k].n}</button>`)}${soon.map(k=>html`<button key=${k} class="chip" disabled aria-disabled="true" style=${{opacity:.7,cursor:'default'}}>${OAUTH[k].n} · bientôt disponible</button>`)}</div>
${!on.length&&!avail.length&&html`<p class="text-xs mut mt-3">Les connexions arrivent bientôt. En attendant, saisis tes chiffres dans « Audience » (onglet Profil) : Synthia s’en sert déjà pour ton plan.</p>`}
${on.length>0&&html`<p class="text-xs rounded-lg p-2 mt-3" style=${{background:'var(--bg)'}}>Total des abonnés connectés : ${N(tot)}</p>`}
<div class=${pc?'grid grid-cols-3 gap-6 items-start':''}>${on.map(k=>html`<${Net} key=${k} p=${k} s=${all[k]} set=${s=>set(k,s)} refresh=${()=>refresh(k)} off=${()=>off(k)}/>`)}</div></section>`}

const [hid,setHid]=useState(()=>{try{return localStorage.getItem('mgr:startHidden')==='1'}catch(e){return false}});
const steps=[['Créer ton profil d’artiste',!!(prof.artist&&prof.artist.trim())&&!prof.draft,'profil'],['Renseigner ton audience (facultatif mais utile)',['tt','ig','fb','views'].some(k=>st[k]!==''&&st[k]!=null),'profil'],['Générer ton plan sur 4 semaines',!!plan,'plan'],['Saisir tes premiers résultats',res.some(r=>r.views!==''),'suivi']];
const n=steps.filter(x=>x[1]).length;
if(hid||n===steps.length)return null;
const hide=()=>{setHid(true);try{localStorage.setItem('mgr:startHidden','1')}catch(e){}};
return html`<section class="card" aria-label="Démarrage"><div class="flex items-start justify-between gap-3"><div><h2 class="font-bold">Pour bien démarrer</h2><p class="text-xs mut">${n} étape${n>1?'s':''} sur ${steps.length}</p></div><button class="chip text-xs shrink-0" onClick=${hide}>Masquer</button></div>
<div class="h-2 rounded-full overflow-hidden mt-3" style=${{background:'var(--bd)'}} role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow=${n*25}><div class="h-full rounded-full" style=${{width:n*25+'%',background:'var(--pt)'}}></div></div>

/* ---------- Palettes personnalisées : couleurs tirées d'une image ou d'une vidéo (tout se passe dans le navigateur) ---------- */
const hx=n=>Math.round(Math.max(0,Math.min(255,n))).toString(16).padStart(2,'0');
const hsl=(h,s,l)=>{h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+hx(f(0)*255)+hx(f(8)*255)+hx(f(4)*255)};

/* Teinte dominante (pixels assez saturés, pondérés), seconde teinte à plus de 40° ; image presque grise : teinte légère de la couleur moyenne */
function hues(d){const bins=new Array(36).fill(0);let n=0,tot=0,ss=0,sc=0,R=0,G=0,B=0;
for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;n++;const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;R+=r;G+=g;B+=b;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),v=mx,sat=mx?(mx-mn)/mx:0;if(v<.2||sat<.25)continue;

/* Lecture d'un fichier choisi : image, ou image d'une vidéo (à la moitié de sa durée, 1 s au plus). Le fichier n'est ni envoyé ni gardé. */
async function loadMedia(file){const T=/^(image|video)\//.exec(file&&file.type||'');
if(!T)throw new Error('Choisis une image ou une vidéo.');
const url=URL.createObjectURL(file),done=()=>URL.revokeObjectURL(url);
try{
if(T[1]==='image'){if(file.size>15e6)throw new Error('Image trop lourde (15 Mo maximum).');
const img=new Image();img.src=url;try{await img.decode()}catch(e){throw new Error('Impossible de lire cette image.')}
return {el:img,w:img.naturalWidth,h:img.naturalHeight,done}}
if(file.size>80e6)throw new Error('Vidéo trop lourde (80 Mo maximum).');
const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
await new Promise((ok,ko)=>{const t=setTimeout(()=>ko(new Error('Vidéo trop longue à charger ou illisible.')),10000);
v.onerror=()=>{clearTimeout(t);ko(new Error('Impossible de lire cette vidéo.'))};
v.onloadedmetadata=()=>{v.currentTime=isFinite(v.duration)?Math.min(1,v.duration/2)||.1:.1};
v.onseeked=()=>{clearTimeout(t);ok()}});
return {el:v,w:v.videoWidth,h:v.videoHeight,done}
}catch(e){done();throw e}}
async function themeFromFile(file){const m=await loadMedia(file);
try{const {w,h}=m;if(!w||!h)throw new Error('Impossible de lire ce fichier.');
const c=document.createElement('canvas');c.width=48;c.height=48;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(m.el,0,0,48,48);
const t=hues(x.getImageData(0,0,48,48).data),tw=Math.min(640,w),tc=document.createElement('canvas');tc.width=tw;tc.height=Math.max(1,Math.round(h*tw/w));tc.getContext('2d').drawImage(m.el,0,0,tc.width,tc.height);
let thumb=null;try{thumb=tc.toDataURL('image/jpeg',.7)}catch(e){}
return {...buildPalettes(t),thumb}}finally{m.done()}}

/* ---------- Export agenda (.ics) : un événement par action, rappel 1 h avant, heures locales ---------- */
const actDate=(x,a)=>{if(!x.d)return null;const m=new Date(x.d);m.setDate(m.getDate()-((m.getDay()+6)%7)+(a.w-2)*7+DAYS.indexOf(a.day));m.setHours(parseInt(a.when,10)||18,0,0,0);return m};
const durMin=t=>{const n=parseFloat(String(t).replace(',','.'))||30;return /h/.test(t)?Math.round(n*60):Math.round(n)};
const icsEsc=t=>String(t==null?'':t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const icsFold=l=>{const o=[];let b=l;while(new TextEncoder().encode(b).length>74){let n=74;while(new TextEncoder().encode(b.slice(0,n)).length>74)n--;o.push(b.slice(0,n));b=' '+b.slice(n)}o.push(b);return o.join('\r\n')};
const icsT=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00'};
function buildICS(prof,plan,now=new Date()){
const x=ctx(prof),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Synthia//Plan de promotion//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc('Synthia : '+(prof.song||'plan'))];
plan.forEach(a=>{const st=actDate(x,a);if(!st)return;const en=new Date(st.getTime()+durMin(a.time)*60000);
L.push('BEGIN:VEVENT','UID:'+a.id+'-'+slug(prof.song||'plan')+'@synthia','DTSTAMP:'+icsT(now)+'Z','DTSTART:'+icsT(st),'DTEND:'+icsT(en),'SUMMARY:'+icsEsc(a.ch+' : '+a.what),'DESCRIPTION:'+icsEsc('Texte à copier :\n'+a.text+'\n\nMesure : '+a.measure+(a.cost>0?'\nCoût (facultatif) : '+N(a.cost)+' FCFA':'')),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Dans 1 h : '+a.what),'TRIGGER:-PT1H','END:VALARM','END:VEVENT')});
L.push('END:VCALENDAR');return L.map(icsFold).join('\r\n')+'\r\n'}
function exportICS(prof,plan,say){
if(!plan||!plan.length){say('Aucun plan à exporter');return}
if(!ctx(prof).d){say('Indique une date de sortie dans ton profil pour placer les actions dans ton agenda');return}
try{const blob=new Blob([buildICS(prof,plan)],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Synthia-agenda-'+(slug(prof.song)||'plan')+'.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);say('Agenda téléchargé ✓ Ouvre le fichier pour l’ajouter à ton calendrier.')}catch(e){say('Export de l’agenda impossible')}}

const [page,setPage]=useState('home'),[wk,setWk]=useState(1),[busy,setBusy]=useState(false),[toast,setToast]=useState(''),[conf,setConf]=useState(null);

const [st,setSt]=useLS('st',ST0);

const w=[1,2,3,4].find(w=>{const l=plan.filter(a=>a.w===w);return l.length&&l.every(a=>done.includes(a.id))&&!seen['w'+w]});

const localHasData=()=>!!(prof.artist&&prof.artist.trim())||!!plan;

const loadAccount=async fromLogin=>{const r=await API.call('GET','/api/state');if(!r.ok)return;const stt=r.json.state||{};

const auth=async(mode,email,password)=>{const r=await API.call('POST','/api/auth/'+mode,{email,password});if(!r.ok)return (r.json&&r.json.message)||'Erreur réseau, réessaie.';await reloadMe();await loadAccount(true);return null};

const q=new URLSearchParams(location.search),pd=q.get('paid'),so=q.get('social'),vt=q.get('verify'),rt=q.get('reset');

if(pd||so){try{history.replaceState(null,'',location.pathname)}catch(e){}

if(so){const p=q.get('p'),nm=p&&OAUTH[p]?OAUTH[p].n:'Le réseau';say(so==='ok'?nm+' connecté ✓':so==='denied'?'Connexion refusée : rien n’a été partagé.':'Connexion impossible, réessaie.');setPage('dash')}}})()},[]);
const resetAll=()=>{setConf(null);setBusy(false);setProf(BLANK);setSt(ST0);setPlan(null);setDone([]);setRes(RES_B());setSoc({});setReco({});setSeen({});setArch([]);setWk(1);go('profil');say('Données effacées ✓');wipe();setTimeout(wipe,200)};
const copy=(t,m='Texte copié ✓')=>{const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();say(m)};try{navigator.clipboard.writeText(t).then(()=>say(m),fb)}catch(e){fb()}};
const share=async()=>{const t=plan.map(a=>`S${a.w} ${a.day} ${a.when} – ${a.ch} : ${a.what}`).join('\n');try{if(navigator.share){await navigator.share({title:'Mon plan Synthia',text:t});return}}catch(e){}copy(t,'Plan copié, prêt à partager ✓')};
const gen=async()=>{setBusy(true);try{const np=await AI.generatePlan(prof,st);if(plan&&offer==='PREMIUM'){setArch([snap(),...arch].slice(0,50));setRes(RES_B())}setPlan(np);setReco({});setSeen({});setDone([]);setWk(1)}finally{setBusy(false)}};
const pdf=()=>{if(offer!=='PREMIUM'){setConf('pdf');return}exportPDF(prof,plan,say,offer)};
/* Une campagne = profil du morceau + plan + actions cochées + résultats + conseils + états « vu » */
const snap=()=>({prof,plan,done,res,reco,seen});
const newCamp=()=>{setConf(null);if(offer==='PREMIUM')setArch([snap(),...arch].slice(0,50));setProf({...prof,song:'',date:'',lien:'',draft:true});setPlan(null);setDone([]);setRes(RES_B());setReco({});setSeen({});setWk(1);go('profil');say(offer==='PREMIUM'?'Ancienne campagne gardée dans « Mes autres plans » ✓':'Nouvelle campagne : l’ancien plan est remplacé ✓')};
const open=(i,to)=>{const a=arch[i];setArch([...(plan?[snap()]:[]),...arch.filter((_,j)=>j!==i)]);setProf(a.prof);setPlan(a.plan);setDone(a.done||[]);setRes(a.res||RES_B());setReco(a.reco||{});setSeen(a.seen||{w1:1,w2:1,w3:1,w4:1,bilan:1});setWk(1);say('Plan ouvert ✓');if(to)go(to)};
const saveText=(id,t)=>{setPlan(pl=>pl.map(a=>a.id===id?{...a,text:t,orig:a.edited?a.orig:a.text,edited:true}:a));say('Texte enregistré ✓')};

const overlays=html`<${React.Fragment}>${!online&&html`<div class="fixed top-0 inset-x-0 z-40 text-center text-xs py-1.5 px-3 text-white" style=${{background:'#9A3412'}} role="status">Hors ligne : tes saisies sont gardées sur cet appareil et seront envoyées au retour de la connexion.</div>`}${imp&&html`<${Confirm} title="Importer tes données ?" text="Ce navigateur contient déjà un profil ou un plan. Veux-tu les enregistrer dans ton compte pour les retrouver partout ?" okLabel="Importer" noLabel="Plus tard" ok=${doImport} close=${()=>setImp(false)}/>`}${conf&&html`<${Confirm} title=${CF[conf].title} text=${CF[conf].text} okLabel=${CF[conf].okLabel} ok=${CF[conf].ok} noLabel=${CF[conf].no} close=${()=>setConf(null)}/>`}${wkEnd&&!conf&&html`<${Confirm} title=${'Semaine '+wkEnd+' terminée 🎉'} text=${'Tu as terminé toutes les actions de la semaine '+wkEnd+'. Renseigne maintenant les résultats obtenus (vues, écoutes, abonnés, interactions) pour que Synthia les compare à tes objectifs.'} okLabel="Saisir mes résultats" noLabel="Plus tard" ok=${()=>{const w=wkEnd;setWkEnd(null);setWk(w);go('suivi')}} close=${()=>setWkEnd(null)}/>`}${toast&&html`<div class="fixed left-1/2 -translate-x-1/2 z-40 px-4 py-2 rounded-full text-sm text-white max-w-[90%] text-center" style=${{bottom:'calc('+(wide?'2rem':'5rem')+' + env(safe-area-inset-bottom,0px))',background:'var(--toast)'}} role="status">${toast}</div>`}<//>`;
