[x=>`Une chaîne WhatsApp te donne un lien direct avec tes fans, sans algorithme.`,'Constituer une communauté fidèle','public,réseaux'],
[x=>`Un bilan montre tes progrès et prépare la suite de ta campagne.`,'Garder l’élan et annoncer la suite','objectif'],
[x=>`Une écoute collective réunit ta communauté de ${x.ville} autour de « ${x.song} », gratuitement.`,'Créer un moment de communauté','ville,public']
];
const dt=(x,w,day)=>{if(!x.d)return '';const m=new Date(x.d);m.setDate(m.getDate()-((m.getDay()+6)%7)+(w-2)*7+DAYS.indexOf(day));return m.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})};
const enrich=(a,x)=>{let {ch,day,what,text}=a,sw='';
if(a.id===3&&x.d)day=DAYS[(x.d.getDay()+6)%7];
if(a.id===2)what=x.stade==='Établi'?'Annoncer le titre à ta communauté via ta chaîne et tes statuts WhatsApp':x.stade==='Débutant'?'Envoyer l’extrait à 20 proches et dans 3 groupes WhatsApp':'Envoyer l’extrait à 50 contacts et dans 5 groupes WhatsApp';
if(a.id===5){what='Lancer '+x.hook+' sur le refrain';text=`Défi #${x.tag}Challenge ! Fais ${x.hook} sur le refrain de « ${x.song} », identifie-moi et je partage les meilleurs !`}
if(!/^(Toutes|WhatsApp)/.test(ch)&&x.nets.length&&!x.nets.includes(ch)){ch=x.nets[0];sw=` Adapté à tes réseaux : ${ch}.`}
if(ch!=='WhatsApp')text+='\n'+x.hs;
const R=RW[a.id],g=a.cost>0||!R;
return {...a,ch,day,what,text,date:dt(x,a.w,day),why:(g?`Dépense facultative, dans ton plafond (${LV[x.lv].l}).`:R[0](x))+sw+(x.lang!=='Français'?` Écris ton texte en ${x.lang}.`:''),aim:g?'Amplifier la portée de tes publications':R[1],basis:['langue',...(g?'budget':R[2]).split(',')].map(k=>BL[k](x))}};
const extras=x=>{const o=[],ch=x.nets.find(n=>n!=='WhatsApp')||'WhatsApp',mk=(id,w,day,c,what,measure,why,aim,b,text)=>o.push({id,w,day,ch:c,what,when:'18 h',time:'30 min',cost:0,measure,text,lv:x.lv,date:dt(x,w,day),why,aim,basis:b.map(k=>BL[k](x))});
if(x.type!=='Single')mk(20,3,'Dimanche',ch,`Faire écouter un deuxième titre de ton ${x.type}`,'Écoutes du deuxième titre',`Ton projet est un ${x.type} : montrer plusieurs titres donne des raisons de revenir.`,'Faire découvrir tout ton projet',['type'],`Tu as aimé « ${x.song} » ? Écoute un autre titre de mon ${x.type} 🎧 ${x.hs}`);
if(x.goal==='Remplir un concert')mk(21,4,'Mercredi','Instagram','Annoncer ton prochain concert ou ta prochaine scène','Réponses et réservations',`Ton objectif est de remplir une salle à ${x.ville}.`,'Faire venir ton public en vrai',['objectif','ville'],`On se retrouve à ${x.ville} ! Dis-moi si tu viens 🎤 ${x.hs}`);
if(x.goal==='Gagner des abonnés')mk(22,3,'Mercredi',ch,'Inviter clairement ton public à s’abonner à ton compte','Nouveaux abonnés','Ton objectif est de gagner des abonnés : une invitation claire en fait venir davantage.','Convertir les spectateurs en abonnés',['objectif'],`Abonne-toi pour ne rien rater de mes prochains titres 🔔 ${x.hs}`);
return o};
const buildPlan=(p,st)=>{const x=ctx(p,st);return [...buildPlanBase(p).map(a=>enrich(a,x)),...extras(x)].sort((a,b)=>a.w-b.w||DAYS.indexOf(a.day)-DAYS.indexOf(b.day))};

/* ---------- Couche IA : simulée pour l’instant ----------
   Pour brancher une vraie IA : remplacer le corps par
   fetch('/api/plan',{method:'POST',body:JSON.stringify({profil,stats})}).then(r=>r.json())
   qui doit renvoyer le même format de tableau d’actions que buildPlan(). */
/* AI_CFG.endpoint = URL de TON serveur (ex. '/api/plan'). Le serveur appelle l’IA avec la clé secrète (jamais dans le navigateur)
   et renvoie [{id,text}] : les textes réécrits par l’IA, fusionnés dans le plan local. Sans endpoint, ou en cas d’échec : textes du moteur local. Voir server.js. */
const AI_CFG={endpoint:null};
const AI={async generatePlan(profil,stats){
await new Promise(r=>setTimeout(r,900));const pl=buildPlan(profil,stats);if(!AI_CFG.endpoint)return pl;
try{const r=await fetch(AI_CFG.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profil,actions:pl.map(a=>({id:a.id,ch:a.ch,what:a.what,text:a.text}))})});if(r.ok){const j=await r.json();if(Array.isArray(j)){const m={};j.forEach(t=>{if(t&&typeof t.text==='string'&&t.text.trim())m[t.id]=t.text});return pl.map(a=>m[a.id]?{...a,text:m[a.id],ai:true}:a)}}}catch(e){}return pl}};

/* ---------- Connexion aux réseaux sociaux (OAuth) ----------

   1. startOAuth() redirige vers la page OFFICIELLE de la plateforme (code + PKCE + state).

      (client secret et jetons jamais dans le navigateur) et le stocke chiffré.
   3. Une tâche planifiée côté serveur appelle l’API officielle en lecture seule et enregistre un relevé par période.
   4. Le navigateur lit /api/social/:plateforme/stats (même format que les relevés de DEMO ci-dessous).
   Squelette à valider avec la documentation actuelle de chaque plateforme (portées, revue d’application, comptes éligibles). */

instagram:{n:'Instagram',auth:'https://www.instagram.com/oauth/authorize',scopes:['instagram_business_basic','instagram_business_manage_insights'],why:['Nom et photo de ton compte','Abonnés et nombre de publications','Statistiques de tes publications'],note:'Un compte professionnel (créateur ou entreprise) est nécessaire.'},
youtube:{n:'YouTube',auth:'https://accounts.google.com/o/oauth2/v2/auth',scopes:['https://www.googleapis.com/auth/youtube.readonly','https://www.googleapis.com/auth/yt-analytics.readonly'],why:['Nom et photo de ta chaîne','Abonnés, vues et nombre de vidéos','Statistiques de tes vidéos (lecture seule)']}};
const OA_CFG={clientId:{tiktok:null,instagram:null,youtube:null},redirectUri:'https://manager.example/oauth/callback'};

const state=b64u(crypto.getRandomValues(new Uint8Array(16))),ver=b64u(crypto.getRandomValues(new Uint8Array(32))),ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));

const q=new URLSearchParams({[p==='tiktok'?'client_key':'client_id']:id,redirect_uri:OA_CFG.redirectUri,response_type:'code',scope:OAUTH[p].scopes.join(p==='tiktok'?',':' '),state,code_challenge:ch,code_challenge_method:'S256'});

const buy=async o=>{if(o.k==='FREE'){say(offer==='PREMIUM'?'PREMIUM reste actif jusqu’à sa date de fin':'Offre gratuite active ✓');return}
if(!user){say('Crée un compte pour passer à PREMIUM');go('reglages');return}
const r=await API.call('POST','/api/pay/checkout',{offer:'PREMIUM'});if(r.ok&&r.json&&r.json.url)location.href=r.json.url;else say((r.json&&r.json.message)||'Paiement indisponible pour le moment')};
const saveProf=(v,isNew)=>{setProf(isNew?{...v,draft:false}:v);say(isNew?'Profil créé ✓':(plan&&(LV[plan[0].lv]?plan[0].lv:'nr')!==lvOf(v)?'Budget mis à jour. Régénère ton plan pour l’appliquer.':'Modifications enregistrées ✓'));if(isNew)go('plan')};
const body={home:html`<${Home} go=${go}/>`,
profil:html`<div class=${wide?'grid grid-cols-5 gap-6 items-start':'space-y-6'}><div class=${wide?'col-span-3':''}><${Profil} prof=${prof} save=${saveProf} go=${go}/></div><div class=${'space-y-6 '+(wide?'col-span-2':'')}><${Audience} st=${st} save=${setSt} go=${go}/><button class="btn btn2 w-full" onClick=${()=>go('offres')}>Voir les abonnements</button></div></div>`,
audience:html`<${Audience} st=${st} save=${setSt} go=${go}/>`,
plan:html`<${Plan} plan=${plan} gen=${gen} busy=${busy} done=${done} tog=${tog} wk=${wk} setWk=${setWk} copy=${copy} share=${share} go=${go} pdf=${pdf} arch=${arch} open=${open} offer=${offer} created=${created}/>`,
dash:html`<${Dash} prof=${prof} plan=${plan} done=${done} res=${res} go=${go} soc=${soc} setSoc=${setSoc} demo=${demo} clear=${clear} reco=${reco}/>`,
suivi:html`<${Suivi} res=${res} setRes=${setRes} wk=${wk} setWk=${setWk} go=${go} plan=${plan} setPlan=${setPlan} done=${done} prof=${prof} reco=${reco} setReco=${setReco}/>`,
bilan:html`<${Bilan} plan=${plan} done=${done} res=${res} prof=${prof} offer=${offer} go=${go} setWk=${setWk} newC=${()=>setConf('new')}/>`,
offres:html`<${Offres} offer=${offer} buy=${buy}/>`,
reglages:html`<${Reglages} ask=${setConf} theme=${theme} setTheme=${setTheme}/>`}[page];
const demoBar=demo&&html`<div class="card text-xs flex items-center justify-between gap-3" role="note"><span>Mode démo : profil, audience et résultats d’exemple, tous fictifs.</span><button class="chip shrink-0" onClick=${()=>{clear();go('profil')}}>Repartir de zéro</button></div>`;
const CF={new:{title:'Lancer une nouvelle campagne ?',text:offer==='PREMIUM'?'Ta campagne actuelle est gardée dans « Mes autres plans », avec ses résultats et son bilan. Tu pourras la rouvrir à tout moment. Tu vas saisir les informations de ton nouveau morceau.':'Avec l’offre FREE, le nouveau plan remplace l’actuel : son suivi et son bilan ne seront plus accessibles. PREMIUM permet de garder tes anciennes campagnes. Tu vas saisir les informations de ton nouveau morceau.',okLabel:'Lancer la campagne',ok:newCamp},pdf:{title:'Le PDF complet est réservé à PREMIUM',text:'Avec l’offre FREE, tu consultes ton plan de promotion directement dans Synthia. Passe à PREMIUM pour télécharger ton plan complet (morceau, objectifs, actions et calendrier sur 4 semaines) au format PDF.',okLabel:'Voir PREMIUM',no:'Fermer',ok:()=>{setConf(null);go('offres')}},reset:{title:'Réinitialiser la démonstration ?',text:'Cette action supprimera les données enregistrées dans la démonstration actuelle : profil artiste, audience, plan de promotion, actions cochées, résultats de suivi, réseaux connectés et offre choisie. Tu repartiras d’un profil vide. Cette action est définitive.',okLabel:'Oui, réinitialiser',ok:resetAll},ex:{title:'Charger l’artiste d’exemple ?',text:'Les données actuelles de la démonstration seront remplacées par un profil fictif (Zeynab Kora) et des résultats d’exemple.',okLabel:'Charger l’exemple',ok:loadEx}};
const overlays=html`<${React.Fragment}>${imp&&html`<${Confirm} title="Importer tes données ?" text="Ce navigateur contient déjà un profil ou un plan. Veux-tu les enregistrer dans ton compte pour les retrouver partout ?" okLabel="Importer" noLabel="Plus tard" ok=${doImport} close=${()=>setImp(false)}/>`}${conf&&html`<${Confirm} title=${CF[conf].title} text=${CF[conf].text} okLabel=${CF[conf].okLabel} ok=${CF[conf].ok} noLabel=${CF[conf].no} close=${()=>setConf(null)}/>`}${wkEnd&&!conf&&html`<${Confirm} title=${'Semaine '+wkEnd+' terminée 🎉'} text=${'Tu as terminé toutes les actions de la semaine '+wkEnd+'. Renseigne maintenant les résultats obtenus (vues, écoutes, abonnés, interactions) pour que Synthia les compare à tes objectifs.'} okLabel="Saisir mes résultats" noLabel="Plus tard" ok=${()=>{const w=wkEnd;setWkEnd(null);setWk(w);go('suivi')}} close=${()=>setWkEnd(null)}/>`}${toast&&html`<div class="fixed left-1/2 -translate-x-1/2 z-40 px-4 py-2 rounded-full text-sm text-white max-w-[90%] text-center" style=${{bottom:'calc('+(wide?'2rem':'5rem')+' + env(safe-area-inset-bottom,0px))',background:'#0B2220'}} role="status">${toast}</div>`}<//>`;
const side=html`<aside class="fixed inset-y-0 left-0 w-64 z-20 border-r flex flex-col p-4" style=${{background:'var(--card)',borderColor:'var(--bd)'}}><div class="flex items-center justify-between gap-2"><button class="tab" aria-label="Accueil" onClick=${()=>go('home')}><${Logo}/></button><button class="chip text-xs" onClick=${()=>go('offres')}>${offer}</button></div>
<nav class="mt-6 flex-1 space-y-1 overflow-y-auto" aria-label="Navigation principale">${SIDE.map(([k,l,ic])=>html`<button key=${k} class=${'tab side flex items-center gap-3 w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium '+(page===k?'on':'')} aria-current=${page===k?'page':null} onClick=${()=>go(k)}><${I} n=${ic} s=${20}/>${l}</button>`)}</nav>
<div class="space-y-2">${dp&&html`<${InstBtn} go=${install} cls="w-full justify-center py-2"/>`}<${ThemeBtn} theme=${theme} cycle=${cycle} text=${true} cls="w-full justify-center py-2"/><${ModeBtn} view=${view} toggle=${toggle} cls="w-full justify-center py-2"/><button class="chip w-full inline-flex items-center justify-center gap-2 py-2" onClick=${()=>setConf('reset')}><${I} n="reset" s=${16}/> Réinitialiser la démonstration</button></div></aside>`;
const header=html`<header class="max-w-2xl mx-auto px-4 pt-4 flex justify-between items-center gap-2"><button class="tab" aria-label="Accueil" onClick=${()=>go('home')}><${Logo}/></button><div class="flex flex-wrap justify-end items-center gap-2">${!framed&&dp&&html`<${InstBtn} go=${install}/>`}${!framed&&html`<${ModeBtn} view=${view} toggle=${toggle}/>`}<${ThemeBtn} theme=${theme} cycle=${cycle} cls="p-2"/><button class=${'chip p-2 '+(page==='reglages'?'on':'')} aria-label="Paramètres" onClick=${()=>go('reglages')}><${I} n="gear" s=${18}/></button><button class="chip text-xs" onClick=${()=>go('offres')}>${offer}</button></div></header>`;
const bottomNav=html`<nav class="fixed bottom-0 inset-x-0 z-20 border-t" style=${{background:'var(--card)',borderColor:'var(--bd)',paddingBottom:'env(safe-area-inset-bottom,0px)'}}><div class="max-w-2xl mx-auto grid grid-cols-4">${TABS.map(([k,l,ic])=>html`<button key=${k} class=${'tab flex flex-col items-center gap-0.5 py-2 '+((page===k||(k==='profil'&&page==='offres'))?'on':'')} aria-current=${page===k?'page':null} onClick=${()=>go(k)}><${I} n=${ic} s=${20}/><span style=${{fontSize:10}}>${l}</span></button>`)}</div></nav>`;
const mobTop=html`<${React.Fragment}>${header}${demoBar&&html`<div class="max-w-2xl mx-auto px-4 pt-3">${demoBar}</div>`}<main key=${page} class="max-w-2xl mx-auto px-4 pt-4 pb-28 pg">${body}</main><//>`;
const shell=wide
?html`<div class="min-h-screen">${side}<div class="ml-64"><main key=${page} class="max-w-6xl mx-auto px-8 py-8 pg">${demoBar&&html`<div class="mb-4">${demoBar}</div>`}${body}</main></div>${overlays}</div>`
:framed
?html`<div class="stage"><div class="fixed top-4 right-4 z-50 flex items-center gap-2">${dp&&html`<${InstBtn} go=${install}/>`}<${ThemeBtn} theme=${theme} cycle=${cycle}/><${ModeBtn} view=${view} toggle=${toggle}/></div><div class="phone"><div id="scroller" class="phone-sc">${mobTop}</div>${bottomNav}${overlays}</div></div>`
:html`<div>${mobTop}${bottomNav}${overlays}</div>`;
return html`<${VC.Provider} value=${wide}><${SrvC.Provider} value=${{me,user,feat,live,setLive,reloadMe,reloadSoc,auth,logout,say,go,resetTok,endReset:()=>setResetTok(null)}}>${shell}<//><//>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
